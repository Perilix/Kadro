# Blueprint Render — https://render.com/docs/blueprint-spec
# À connecter au dépôt GitHub Perilix/Kadro depuis le dashboard Render (New > Blueprint).
# Deux services : l'API (Docker) et le site web coach (statique).
# L'app mobile (apps/mobile, Expo) ne passe PAS par Render : builds EAS → TestFlight / Play Store.

services:
  # --- API NestJS ---------------------------------------------------------
  - type: web
    name: kadro-api
    runtime: docker
    region: frankfurt
    plan: starter
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /v1/health
    envVars:
      - key: MONGODB_URI
        sync: false # à coller depuis Atlas (Database > Connect > Drivers), avec /kadro comme nom de base
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://kadro.app,https://kadro-app.com,https://kadro-web.onrender.com
      - key: JOIN_URL_BASE
        value: https://kadro-app.com/rejoindre
      - key: API_PUBLIC_URL
        value: https://kadro-api.onrender.com
      - key: WEB_APP_URL
        value: https://kadro-web.onrender.com
      - key: TOKENS_ENC_KEY
        generateValue: true
      - key: STRAVA_CLIENT_ID
        sync: false
      - key: STRAVA_CLIENT_SECRET
        sync: false
      - key: STRAVA_VERIFY_TOKEN
        generateValue: true

  # --- Web coach (Angular, statique) --------------------------------------
  # corepack enable échoue sur Render (/usr/bin en lecture seule) — on installe pnpm via npm.
  # La version de Node est figée par .node-version à la racine.
  - type: web
    name: kadro-web
    runtime: static
    buildCommand: npm install -g pnpm@9.15.0 && pnpm install --frozen-lockfile && pnpm --filter @kadro/tokens build && pnpm --filter @kadro/shared build && pnpm --filter @kadro/web build
    staticPublishPath: apps/web/dist/web/browser
    routes:
      # SPA : toutes les routes retombent sur index.html
      - type: rewrite
        source: /*
        destination: /index.html
