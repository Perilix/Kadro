# Blueprint Render — https://render.com/docs/blueprint-spec
# À connecter au dépôt GitHub Perilix/Kadro depuis le dashboard Render (New > Blueprint).
services:
  - type: web
    name: kadro-api
    runtime: docker
    region: frankfurt
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false # à coller depuis Atlas (Database > Connect > Drivers)
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://kadro.app,https://kadro-app.com
      - key: JOIN_URL_BASE
        value: https://kadro-app.com/rejoindre

  # apps/web (Angular, site statique) — à décommenter quand l'app existera :
